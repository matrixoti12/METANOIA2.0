<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyberFlameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="45%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>
  </defs>

  <g id="church-emblem" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Right & Central Flame Tongues -->
    <path d="M 308 42 C 300 120, 375 160, 372 230 C 370 270, 340 310, 305 340 C 322 300, 325 245, 290 190 C 275 165, 280 120, 308 42 Z" />
    
    <!-- Central Flowing Flame Ridge -->
    <path d="M 295 62 C 285 130, 335 180, 332 235 C 330 265, 310 295, 285 320 C 300 280, 295 230, 275 185 C 265 160, 275 125, 295 62 Z" />

    <!-- Left Flowing Flame Wing -->
    <path d="M 278 126 C 240 180, 220 230, 235 295 C 245 330, 270 355, 305 340 C 260 320, 255 255, 282 200 C 295 170, 290 145, 278 126 Z" />
    
    <!-- Inner Flame Tongue Accent -->
    <path d="M 268 235 C 255 265, 260 300, 285 325 C 270 295, 275 265, 292 240 C 285 235, 275 230, 268 235 Z" />

    <!-- Cradle / Ark / Vessel embracing the people -->
    <path d="M 180 340 C 180 435, 420 435, 420 340 C 390 415, 210 415, 180 340 Z" fill="currentColor" fill-opacity="0.08" />

    <!-- Three Unified Figures Lifting Hands Under Flame -->
    <!-- Left Person -->
    <circle cx="255" cy="350" r="10" />
    <path d="M 238 368 C 248 358, 255 362, 265 352" />
    <path d="M 265 352 C 275 345, 285 345, 304 340" />
    <path d="M 248 375 L 252 408 M 262 375 L 260 408" />
    <path d="M 245 368 C 245 385, 268 385, 268 368" />

    <!-- Right Person -->
    <circle cx="330" cy="352" r="10" />
    <path d="M 346 370 C 336 360, 328 362, 320 352" />
    <path d="M 320 352 C 312 346, 308 346, 305 340" />
    <path d="M 324 375 L 322 408 M 336 375 L 340 408" />
    <path d="M 320 370 C 320 385, 342 385, 342 370" />

    <!-- Center Child / Small Figure -->
    <circle cx="292" cy="372" r="7" />
    <path d="M 282 382 L 278 372 M 302 382 L 306 372" />
    <path d="M 288 392 L 286 410 M 296 392 L 298 410" />
    <path d="M 284 382 C 284 395, 300 395, 300 382" />
  </g>

  <!-- Typography: IGLESIA PACTO Y BENDICION GUAZAPA -->
  <g id="church-text" fill="currentColor" text-anchor="middle" font-family="'Space Grotesk', 'Outfit', sans-serif">
    <text x="290" y="465" font-size="20" letter-spacing="10" font-weight="400" opacity="0.9">IGLESIA</text>
    <text x="300" y="508" font-size="34" letter-spacing="3" font-weight="700">PACTO Y BENDICIÓN</text>
    <text x="385" y="538" font-size="17" letter-spacing="8" font-weight="500" opacity="0.85">GUAZAPA</text>
  </g>
</svg>
